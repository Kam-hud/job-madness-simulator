<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>前端测试</title>
</head>
<body>
    <h1>前端测试页面</h1>
    <div id="challenge-title">职业挑战</div>
    <div id="challenge-description"></div>
    
    <script>
        const API_BASE = '';
        
        async function startGame() {
            console.log('🚀 启动游戏...');
            
            try {
                const response = await fetch(`${API_BASE}/api/start`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json; charset=utf-8'
                    }
                });
                
                console.log('📡 响应状态:', response.status);
                
                const text = await response.text();
                console.log('📥 原始响应文本:', text);
                
                const data = JSON.parse(text);
                console.log('📥 解析后的数据:', data);
                
                if (data.current_event) {
                    console.log('🎮 准备显示挑战:', data.current_event);
                    document.getElementById('challenge-title').textContent = data.current_event.title || '无标题';
                    document.getElementById('challenge-description').textContent = data.current_event.description || '无描述';
                } else {
                    console.error('❌ current_event 为空');
                    document.getElementById('challenge-description').textContent = '暂无挑战数据';
                }
                
            } catch (error) {
                console.error('❌ 启动游戏失败:', error);
                document.getElementById('challenge-description').textContent = '网络连接失败: ' + error.message;
            }
        }
        
        document.addEventListener('DOMContentLoaded', startGame);
    </script>
</body>
</html>
