<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#1a2a4a"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#0066cc"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88"/>
      <stop offset="100%" style="stop-color:#00d4ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="4" y="4" width="120" height="120" rx="24" ry="24" fill="url(#bg)" stroke="#1e3a5f" stroke-width="2"/>

  <!-- Shield shape -->
  <path d="M64 16 L98 28 L98 60 C98 82 82 98 64 108 C46 98 30 82 30 60 L30 28 Z"
        fill="none" stroke="url(#shield)" stroke-width="3" filter="url(#glow)" opacity="0.9"/>

  <!-- Upward arrow inside shield (growth) -->
  <path d="M64 80 L64 42 M52 54 L64 42 L76 54"
        fill="none" stroke="url(#arrow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Small horizontal bars (skill levels) -->
  <rect x="48" y="68" width="8" height="3" rx="1.5" fill="#00ff88" opacity="0.8"/>
  <rect x="58" y="65" width="8" height="3" rx="1.5" fill="#00ff88" opacity="0.8"/>
  <rect x="68" y="62" width="8" height="3" rx="1.5" fill="#00ff88" opacity="0.8"/>

  <!-- Corner accents -->
  <circle cx="16" cy="16" r="2" fill="#00d4ff" opacity="0.5"/>
  <circle cx="112" cy="16" r="2" fill="#00d4ff" opacity="0.5"/>
  <circle cx="16" cy="112" r="2" fill="#00d4ff" opacity="0.5"/>
  <circle cx="112" cy="112" r="2" fill="#00d4ff" opacity="0.5"/>
</svg>